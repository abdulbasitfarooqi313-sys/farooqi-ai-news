# 🕌 نوائے فاروقی — سیرت سیریز کی قسط ویڈیو (لمبی + دو شارٹس) نمونہ ٹیلیگرام پر منظوری کے لیے۔
# مالک کی ہدایت: اضافی کام لامحدود پبلک رنر پر۔ صرف ہاتھ سے چلتی ہے؛ کچھ شائع نہیں ہوتا۔
name: Nawa seerat video
run-name: "Nawa seerat ep ${{ github.event.inputs.ep }}"
on:
  workflow_dispatch:
    inputs:
      ep: { description: "قسط نمبر", default: "1" }
      real: { description: "اصل Gemini آواز (خالی = Edge نمونہ)", default: "" }
permissions:
  contents: read
concurrency: nawa-seerat
jobs:
  make:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Nawa code (private)
        env: { NAWA_TOKEN: "${{ secrets.NAWA_TOKEN }}" }
        run: git clone -q "https://x-access-token:${NAWA_TOKEN}@github.com/nawaefarooqi-bit/nawaefarooqi-agents" nawa-repo
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: cd nawa-repo && pip install -q -r requirements.txt && python -m playwright install --with-deps chromium >/dev/null && sudo apt-get install -y -qq ffmpeg >/dev/null
      - name: Make
        working-directory: nawa-repo
        env:
          GEMINI_API_KEY: ${{ secrets.NAWA_GEMINI_API_KEY }}
          GEMINI_TTS_BACKUP_KEY: ${{ secrets.NAWA_GEMINI_TTS_BACKUP_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.NAWA_TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.NAWA_TELEGRAM_CHAT_ID }}
          EP: ${{ github.event.inputs.ep }}
          REAL: ${{ github.event.inputs.real }}
        run: |
          F="--sample"; [ -n "$REAL" ] && F=""
          python -u -m nawa.seerat_video "$EP" $F --send
