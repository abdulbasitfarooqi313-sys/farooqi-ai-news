name: ts-diag (temporary)
on: { push: { paths: [".github/workflows/ts-diag.yml"] }, workflow_dispatch: {} }
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - env:
          A: ${{ secrets.TOOLSCAPE_BOT_TOKEN }}
          B: ${{ secrets.TS_TELEGRAM_BOT_TOKEN }}
          G: ${{ secrets.TOOLSCAPE_GH_TOKEN }}
          C: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python3 - <<'PY'
          import os, json, urllib.request as U
          A, B, C = os.environ["A"].strip(), os.environ["B"].strip(), os.environ["C"].strip()
          print("A set", bool(A), "B set", bool(B), "same bot", A.split(":")[0] == B.split(":")[0], "GH token", bool(os.environ["G"].strip()))
          for name, t in (("A", A), ("B", B)):
              if not t: continue
              me = json.load(U.urlopen(f"https://api.telegram.org/bot{t}/getMe"))["result"]["username"]
              wh = json.load(U.urlopen(f"https://api.telegram.org/bot{t}/getWebhookInfo"))["result"]
              ups = json.load(U.urlopen(f"https://api.telegram.org/bot{t}/getUpdates?timeout=0"))["result"]
              print(name, me, "webhook:", bool(wh.get("url")), "pending:", wh.get("pending_update_count"), "updates:", len(ups))
              for u in ups[-15:]:
                  cb = u.get("callback_query") or {}
                  m = u.get("message") or {}
                  print("  ", u["update_id"], "cb" if cb else "msg", cb.get("data", "")[:20], "from==chat:", str((cb.get("from") or m.get("from") or {}).get("id")) == C)
          PY
