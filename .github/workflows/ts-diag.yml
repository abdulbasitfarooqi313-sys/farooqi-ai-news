name: ts-diag (temporary)
on: { push: { paths: [".github/workflows/ts-diag.yml"] } }
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - env:
          T1: ${{ secrets.TS_TOKEN }}
          T2: ${{ secrets.TOOLSCAPE_GH_TOKEN }}
        run: |
          for n in T1 T2; do
            t=${!n}; [ -n "$t" ] || { echo "$n missing"; continue; }
            rm -rf r; git clone -q --depth 1 "https://x-access-token:${t}@github.com/hellotoolscape/ai-tube-factory" r && echo "$n clone ok" || { echo "$n clone fail"; continue; }
            cd r; git config user.name x; git config user.email x@x; git commit -q --allow-empty -m test
            git push --dry-run -q 2>&1 | tail -2; echo "$n push-dry exit $?"
            curl -s -H "Authorization: Bearer $t" https://api.github.com/repos/hellotoolscape/ai-tube-factory | python3 -c "import json,sys;print('$n perms',json.load(sys.stdin).get('permissions'))"
            cd ..
          done
