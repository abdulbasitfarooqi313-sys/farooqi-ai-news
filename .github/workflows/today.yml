# 📅 آج کا شیڈول — تینوں چینل، ہر صبح ~6:50 (سعودی) ٹیلیگرام پر (مالک، 15 نومبر 2026)
name: Today schedule
on:
  schedule:
    - cron: "47 3 * * *"
  workflow_dispatch:
    inputs:
      dry: { description: "صرف لاگ میں (ٹیلیگرام نہیں): yes", required: false, default: "no" }
permissions:
  contents: read
  actions: read
concurrency: today
jobs:
  today:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Engine (private code)
        env: { ENGINE_TOKEN: "${{ secrets.ENGINE_TOKEN }}" }
        run: |
          if [ -n "$ENGINE_TOKEN" ]; then
            if git clone -q --depth 1 "https://x-access-token:${ENGINE_TOKEN}@github.com/abdulbasitfarooqi313-sys/farooqi-ai-news-engine" /tmp/engine; then
              rsync -a --exclude .git --exclude .gitignore --exclude .github --exclude state --exclude media --exclude cache --exclude desk /tmp/engine/ ./
              rm -rf /tmp/engine; echo "engine: ok"
            else
              code=$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $ENGINE_TOKEN" https://api.github.com/repos/abdulbasitfarooqi313-sys/farooqi-ai-news-engine)
              echo "::warning::engine clone failed (api $code, token len ${#ENGINE_TOKEN}, prefix ${ENGINE_TOKEN:0:11}) — using code in this repo"
              [ -f news/bulletin.py ] || exit 1
            fi
          else echo "::warning::ENGINE_TOKEN missing — using code in this repo"; fi
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install requests json-repair
      - name: Report
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_NEWS_KEY: ${{ secrets.GEMINI_NEWS_KEY }}
          GEMINI_BACKUP_KEY: ${{ secrets.GEMINI_BACKUP_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          NEWS_BOT_TOKEN: ${{ secrets.NEWS_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          TS_YOUTUBE_CLIENT_ID: ${{ secrets.TS_YOUTUBE_CLIENT_ID }}
          TS_YOUTUBE_CLIENT_SECRET: ${{ secrets.TS_YOUTUBE_CLIENT_SECRET }}
          TS_YOUTUBE_REFRESH_TOKEN: ${{ secrets.TS_YOUTUBE_REFRESH_TOKEN }}
          NAWA_YOUTUBE_CLIENT_ID: ${{ secrets.NAWA_YOUTUBE_CLIENT_ID }}
          NAWA_YOUTUBE_CLIENT_SECRET: ${{ secrets.NAWA_YOUTUBE_CLIENT_SECRET }}
          NAWA_YOUTUBE_REFRESH_TOKEN: ${{ secrets.NAWA_YOUTUBE_REFRESH_TOKEN }}
          # 🩺 حالت رپورٹ (news/health.py) — صرف پڑھتی/جانچتی ہے
          GH_TOKEN: ${{ github.token }}
          TS_TOKEN: ${{ secrets.TS_TOKEN }}
          NAWA_TOKEN: ${{ secrets.NAWA_TOKEN }}
          ENGINE_TOKEN: ${{ secrets.ENGINE_TOKEN }}
          GEMINI_CHAT_GH: ${{ secrets.GEMINI_CHAT_GH }}
          GEMINI_BOT_TOKEN: ${{ secrets.GEMINI_BOT_TOKEN }}
          GEMINI_TTS_BULLETIN: ${{ secrets.GEMINI_TTS_BULLETIN }}
          GEMINI_TTS_FLASH: ${{ secrets.GEMINI_TTS_FLASH }}
          GEMINI_TTS_PODCAST: ${{ secrets.GEMINI_TTS_PODCAST }}
          NAWA_GEMINI_API_KEY: ${{ secrets.NAWA_GEMINI_API_KEY }}
          NAWA_GEMINI_TTS_BACKUP_KEY: ${{ secrets.NAWA_GEMINI_TTS_BACKUP_KEY }}
          TS_GEMINI_API_KEY: ${{ secrets.TS_GEMINI_API_KEY }}
          BLOGGER_REFRESH_TOKEN: ${{ secrets.BLOGGER_REFRESH_TOKEN }}
          FB_PAGE_ID_NEWS: ${{ secrets.FB_PAGE_ID_NEWS }}
          FB_PAGE_TOKEN_NEWS: ${{ secrets.FB_PAGE_TOKEN_NEWS }}
          IG_USER_ID_NEWS: ${{ secrets.IG_USER_ID_NEWS }}
          FB_PAGE_ID_NAWA: ${{ secrets.FB_PAGE_ID_NAWA || secrets.NAWA_FB_PAGE_ID }}
          FB_PAGE_TOKEN_NAWA: ${{ secrets.FB_PAGE_TOKEN_NAWA || secrets.NAWA_FB_PAGE_TOKEN }}
          IG_USER_ID_NAWA: ${{ secrets.IG_USER_ID_NAWA || secrets.NAWA_IG_USER_ID }}
          FB_PAGE_ID_TOOLSCAPE: ${{ secrets.FB_PAGE_ID_TOOLSCAPE }}
          FB_PAGE_TOKEN_TOOLSCAPE: ${{ secrets.FB_PAGE_TOKEN_TOOLSCAPE }}
          IG_USER_ID_TOOLSCAPE: ${{ secrets.IG_USER_ID_TOOLSCAPE }}
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          YT_ANALYTICS_CLIENT_ID: ${{ secrets.YT_ANALYTICS_CLIENT_ID }}
          YT_ANALYTICS_CLIENT_SECRET: ${{ secrets.YT_ANALYTICS_CLIENT_SECRET }}
          TS_YT_ANALYTICS_CLIENT_ID: ${{ secrets.TS_YT_ANALYTICS_CLIENT_ID }}
          TS_YT_ANALYTICS_CLIENT_SECRET: ${{ secrets.TS_YT_ANALYTICS_CLIENT_SECRET }}
          NAWA_YT_ANALYTICS_CLIENT_ID: ${{ secrets.NAWA_YT_ANALYTICS_CLIENT_ID }}
          NAWA_YT_ANALYTICS_CLIENT_SECRET: ${{ secrets.NAWA_YT_ANALYTICS_CLIENT_SECRET }}
          YT_ANALYTICS_TOKEN: ${{ secrets.YT_ANALYTICS_TOKEN }}
          TS_YT_ANALYTICS_TOKEN: ${{ secrets.TS_YT_ANALYTICS_TOKEN }}
          NAWA_YT_ANALYTICS_TOKEN: ${{ secrets.NAWA_YT_ANALYTICS_TOKEN }}
        run: python -u -m news.today ${{ github.event.inputs.dry == 'yes' && 'dry' || '' }}
      - name: Alert on failure
        if: failure()
        env:
          TOKEN: ${{ secrets.NEWS_BOT_TOKEN || secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_SECRET: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          CHAT=$(python3 -c "import json;print(json.load(open('state/news.json')).get('chat',''))" 2>/dev/null); CHAT=${CHAT:-$CHAT_SECRET}
          curl -s -X POST "https://api.telegram.org/bot$TOKEN/sendMessage" --data-urlencode "chat_id=$CHAT" \
            --data-urlencode "text=⚠️ اے آئی نیوز: «${{ github.workflow }}» ناکام ہو گیا۔ یہ لنک Jules یا Claude کو دکھائیں: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" >/dev/null || true
