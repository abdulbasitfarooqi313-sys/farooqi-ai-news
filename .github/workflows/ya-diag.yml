name: ya-diag (temporary)
on: { push: { paths: [".github/workflows/ya-diag.yml"] } }
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - env:
          I: ${{ secrets.YT_ANALYTICS_CLIENT_ID }}
          S: ${{ secrets.YT_ANALYTICS_CLIENT_SECRET }}
          T: ${{ secrets.YT_ANALYTICS_TOKEN }}
        run: |
          python3 - <<'PY'
          import os, json, urllib.request, urllib.parse, urllib.error
          i, s, t = os.environ["I"], os.environ["S"], os.environ["T"]
          for n, v in (("ID", i), ("SECRET", s), ("TOKEN", t)):
              print(n, "len", len(v), "spaces/newlines:", v != v.strip() or " " in v.strip(), "quotes:", '"' in v or "'" in v)
          print("ID ends .apps.googleusercontent.com:", i.strip().endswith(".apps.googleusercontent.com"), "| ID starts with digit:", i.strip()[:1].isdigit())
          print("SECRET starts GOCSPX-:", s.strip().startswith("GOCSPX-"), "| TOKEN starts 1//:", t.strip().startswith("1//"))
          print("SECRET looks like ID (ends .com):", s.strip().endswith(".com"), "| TOKEN looks like access token (ya29):", t.strip().startswith("ya29"))
          d = urllib.parse.urlencode({"client_id": i.strip(), "client_secret": s.strip(), "refresh_token": t.strip(), "grant_type": "refresh_token"}).encode()
          try:
              r = json.load(urllib.request.urlopen("https://oauth2.googleapis.com/token", d, timeout=30)); print("OK scope:", r.get("scope"))
          except urllib.error.HTTPError as e:
              print("ERROR", e.code, json.loads(e.read().decode()))
          PY
