name: ya-diag (temporary)
on: { push: { paths: [".github/workflows/ya-diag.yml"] } }
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - env:
          I: ${{ secrets.TS_YT_ANALYTICS_CLIENT_ID }}
          S: ${{ secrets.TS_YT_ANALYTICS_CLIENT_SECRET }}
          T: ${{ secrets.TS_YT_ANALYTICS_TOKEN }}
        run: |
          python3 - <<'PY'
          import os, json, urllib.request, urllib.parse, urllib.error
          i, s, t = (os.environ[k].strip() for k in "IST")
          print("CHECK ID ok:", i.endswith(".apps.googleusercontent.com") and i[:1].isdigit(), "| SECRET ok:", s.startswith("GOCSPX-"), "| TOKEN ok:", t.startswith("1//"))
          d = urllib.parse.urlencode({"client_id": i, "client_secret": s, "refresh_token": t, "grant_type": "refresh_token"}).encode()
          try:
              r = json.load(urllib.request.urlopen("https://oauth2.googleapis.com/token", d, timeout=30)); tok = r["access_token"]
              print("RESULT OK", r.get("scope"))
              q = urllib.parse.urlencode({"ids": "channel==MINE", "startDate": "2026-11-01", "endDate": "2026-11-10", "metrics": "views"})
              req = urllib.request.Request("https://youtubeanalytics.googleapis.com/v2/reports?" + q, headers={"Authorization": "Bearer " + tok})
              print("RESULT CHANNEL views 1-10 Nov:", json.load(urllib.request.urlopen(req, timeout=30)).get("rows"))
          except urllib.error.HTTPError as e:
              print("RESULT ERROR", e.code, e.read().decode()[:300])
          PY
