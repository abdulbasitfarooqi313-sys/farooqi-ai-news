name: nawa-dup (temporary, owner-approved delete of 2 duplicate private videos)
on: { push: { paths: [".github/workflows/nawa-dup.yml"] } }
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - env:
          YI: ${{ secrets.NAWA_YOUTUBE_CLIENT_ID }}
          YS: ${{ secrets.NAWA_YOUTUBE_CLIENT_SECRET }}
          YT: ${{ secrets.NAWA_YOUTUBE_REFRESH_TOKEN }}
        run: |
          python3 - <<'PY'
          import os, json, urllib.request, urllib.parse, urllib.error
          d = urllib.parse.urlencode({"client_id": os.environ["YI"].strip(), "client_secret": os.environ["YS"].strip(), "refresh_token": os.environ["YT"].strip(), "grant_type": "refresh_token"}).encode()
          tok = json.load(urllib.request.urlopen("https://oauth2.googleapis.com/token", d, timeout=30))["access_token"]
          H = {"Authorization": "Bearer " + tok}
          ids = ["a1mzXMM96X8", "sYjmAAz-PLI"]
          r = json.load(urllib.request.urlopen(urllib.request.Request("https://www.googleapis.com/youtube/v3/videos?part=snippet,status&id=" + ",".join(ids), headers=H), timeout=30))
          found = {v["id"]: v for v in r.get("items", [])}
          for i in ids:
              v = found.get(i)
              if not v:
                  print("RESULT", i, "| نہیں ملی (پہلے ہی ہٹ چکی؟)"); continue
              st = v["status"]
              info = f"{v['snippet']['channelTitle']} | {v['snippet']['title'][:60]} | {st.get('privacyStatus')} | publishAt={st.get('publishAt')}"
              if st.get("privacyStatus") != "private" or st.get("publishAt"):
                  print("RESULT SKIP (not plain private):", i, "|", info); continue
              req = urllib.request.Request("https://www.googleapis.com/youtube/v3/videos?id=" + i, headers=H, method="DELETE")
              try:
                  urllib.request.urlopen(req, timeout=30); print("RESULT DELETED", i, "|", info)
              except urllib.error.HTTPError as e:
                  print("RESULT DELETE FAILED", i, e.code, e.read().decode()[:200], "|", info)
          PY
