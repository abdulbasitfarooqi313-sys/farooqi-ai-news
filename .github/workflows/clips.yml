# ✂️ لمبی ویڈیو سے خودکار شارٹ — مالک (19 نومبر 2026، بہتری #6): منظور شدہ بلیٹن/پوڈکاسٹ/راؤنڈ اپ کا سب سے دلچسپ 30–55 سیکنڈ،
# کھڑا شارٹ بنا کر ٹیلیگرام پر ✅/❌۔ کوئی نئی جیمنائی آواز نہیں (اصل ویڈیو کی آواز)؛ Whisper مفت، اسی پبلک رنر پر۔ دن میں ایک۔
name: Auto clips

on:
  schedule:
    - cron: "20 19 * * *"     # رات 10:20 (سعودی) — شام کے بلیٹن/پوڈکاسٹ کی منظوری کے بعد
    - cron: "20 7 * * *"      # صبح 10:20 — رات کو رہ گیا ہو تو
  workflow_dispatch:
    inputs:
      mode:
        description: "sample = صرف ٹیلیگرام نمونہ · real = اصل"
        required: false
        default: "sample"

permissions:
  contents: write

concurrency:
  group: bulletin
  cancel-in-progress: false

jobs:
  clips:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - name: Engine (private code)
        env: { ENGINE_TOKEN: "${{ secrets.ENGINE_TOKEN }}" }
        run: |
          if [ -n "$ENGINE_TOKEN" ]; then
            if git clone -q --depth 1 "https://x-access-token:${ENGINE_TOKEN}@github.com/abdulbasitfarooqi313-sys/farooqi-ai-news-engine" /tmp/engine; then
              rsync -a --exclude .git --exclude .gitignore --exclude .github --exclude state --exclude media --exclude cache --exclude desk /tmp/engine/ ./
              rm -rf /tmp/engine; echo "engine: ok"
            else
              code=$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $ENGINE_TOKEN" https://api.github.com/repos/abdulbasitfarooqi313-sys/farooqi-ai-news-engine)
              echo "::warning::engine clone failed (api $code, token len ${#ENGINE_TOKEN}, prefix ${ENGINE_TOKEN:0:11}) — using code in this repo"
              [ -f news/bulletin.py ] || exit 1
            fi
          else echo "::warning::ENGINE_TOKEN missing — using code in this repo"; fi
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt && pip install -q faster-whisper
      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Run
        env:
          GEMINI_NEWS_KEY: ${{ secrets.GEMINI_NEWS_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_BACKUP_KEY: ${{ secrets.GEMINI_BACKUP_KEY }}
          TS_GEMINI_API_KEY: ${{ secrets.TS_GEMINI_API_KEY }}
          GEMINI_TTS_BULLETIN: ${{ secrets.GEMINI_TTS_BULLETIN }}
          GEMINI_TTS_FLASH: ${{ secrets.GEMINI_TTS_FLASH }}
          GEMINI_TTS_PODCAST: ${{ secrets.GEMINI_TTS_PODCAST }}
          NEWS_BOT_TOKEN: ${{ secrets.NEWS_BOT_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          OPENVERSE_CLIENT_ID: ${{ secrets.OPENVERSE_CLIENT_ID }}
          OPENVERSE_CLIENT_SECRET: ${{ secrets.OPENVERSE_CLIENT_SECRET }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          BLOGGER_REFRESH_TOKEN: ${{ secrets.BLOGGER_REFRESH_TOKEN }}
        run: |
          python -m playwright install --with-deps chromium >/dev/null 2>&1 || true
          M="${{ github.event.inputs.mode }}"; [ "${{ github.event_name }}" = "schedule" ] && M=real
          if [ "$M" = real ]; then python -m news.clips; else python -m news.clips sample; fi
      - name: Keep a review copy
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ -f clip.mp4 ] || exit 0
          [ "${{ github.event_name }}" = "schedule" ] || [ "${{ github.event.inputs.mode }}" = "real" ] || exit 0
          T="clip-$(TZ=Asia/Riyadh date +%F)"
          gh release delete "$T" -y --cleanup-tag 2>/dev/null || true
          gh release create "$T" --title "$T" --notes "review copy" clip.mp4 clip_thumb.jpg || true
      - name: Save
        if: always() && (github.event_name == 'schedule' || github.event.inputs.mode == 'real')
        run: |
          git config user.name "ai-news-bot"
          git config user.email "ai-news-bot@users.noreply.github.com"
          for f in state/news.json; do [ -f "$f" ] && git add "$f"; done; git add -A state/seo state/blog_queue media 2>/dev/null || true; true
                    git diff --cached --quiet && exit 0
          git commit -m "خودکار شارٹ"
          for i in 1 2 3; do git pull --rebase --autostash -X theirs && git push && exit 0; sleep 10; done; echo "push ناکام"; exit 1

      - name: Alert on failure   # مقررہ رن کی ناکامی نگران (watchdog) وجہ سمیت بتاتا ہے — یہاں دوہرا پیغام نہیں
        if: failure() && github.event_name != 'schedule'
        env:
          TOKEN: ${{ secrets.NEWS_BOT_TOKEN || secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_SECRET: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          CHAT=$(python3 -c "import json;print(json.load(open('state/news.json')).get('chat',''))" 2>/dev/null); CHAT=${CHAT:-$CHAT_SECRET}
          curl -s -X POST "https://api.telegram.org/bot$TOKEN/sendMessage" --data-urlencode "chat_id=$CHAT" \
            --data-urlencode "text=⚠️ اے آئی نیوز: «${{ github.workflow }}» ناکام ہو گیا۔ یہ لنک Jules یا Claude کو دکھائیں: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" >/dev/null || true
