# ✉️ مالک کو اے آئی نیوز بوٹ پر ایک پیغام (ہاتھ سے، جانچ/نمونے کے لیے)
name: Owner message
on:
  workflow_dispatch:
    inputs:
      text: { description: "پیغام", required: true }
permissions:
  contents: read
jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - env:
          TOKEN: ${{ secrets.NEWS_BOT_TOKEN || secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_SECRET: ${{ secrets.TELEGRAM_CHAT_ID }}
          TEXT: ${{ github.event.inputs.text }}
        run: |
          CHAT=$(python3 -c "import json;print(json.load(open('state/news.json')).get('chat',''))" 2>/dev/null); CHAT=${CHAT:-$CHAT_SECRET}
          curl -s -d "chat_id=$CHAT" --data-urlencode "text=$TEXT" "https://api.telegram.org/bot$TOKEN/sendMessage" | head -c 60
