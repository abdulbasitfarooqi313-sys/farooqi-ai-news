# فاروقی اے آئی نیوز — پیر، بدھ، ہفتہ کو بلیٹن (باقی دن رن فوراً ختم ہو جاتا ہے) → @farooqi_ai_news_bot
name: Daily Bulletin

on:
  schedule:
    - cron: "0 12 * * *"    # 3:00 سہ پہر (سعودی) — ٹیلیگرام پر تقریباً 3:30–4، اپلوڈ 5 بجے (7 بجے پاکستان)
    - cron: "0 14 * * *"    # 5:00 شام — نہ بنا ہو تو (محفوظ آوازوں سے آگے)
    - cron: "0 16 * * *"    # 7:00 شام — آخری کوشش
  workflow_dispatch:
    inputs:
      force:
        description: "دوبارہ بنائیں (آج کا بن چکا ہو تب بھی): yes"
        required: false
        default: "no"

permissions:
  contents: write

concurrency:
  group: bulletin
  cancel-in-progress: false

jobs:
  bulletin:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - name: Engine (private code)
        env: { ENGINE_TOKEN: "${{ secrets.ENGINE_TOKEN }}" }
        run: |
          if [ -n "$ENGINE_TOKEN" ]; then
            if git clone -q --depth 1 "https://x-access-token:${ENGINE_TOKEN}@github.com/abdulbasitfarooqi313-sys/farooqi-ai-news-engine" /tmp/engine; then
              rsync -a --exclude .git --exclude .gitignore --exclude .github --exclude state --exclude media --exclude cache --exclude desk /tmp/engine/ ./
              rm -rf /tmp/engine; echo "engine: ok"
            else
              code=$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $ENGINE_TOKEN" https://api.github.com/repos/abdulbasitfarooqi313-sys/farooqi-ai-news-engine)
              echo "::warning::engine clone failed (api $code, token len ${#ENGINE_TOKEN}, prefix ${ENGINE_TOKEN:0:11}) — using code in this repo"
              [ -f news/bulletin.py ] || exit 1
            fi
          else echo "::warning::ENGINE_TOKEN missing — using code in this repo"; fi
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Make bulletin
        env:
          GEMINI_NEWS_KEY: ${{ secrets.GEMINI_NEWS_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_TTS_KEY: ${{ secrets.GEMINI_TTS_BULLETIN }}     # اس کام کی آواز کا اپنا پروجیکٹ
          TTS_JOB: bulletin
          GEMINI_BACKUP_KEY: ${{ secrets.GEMINI_BACKUP_KEY }}
          NEWS_BOT_TOKEN: ${{ secrets.NEWS_BOT_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          BLOGGER_REFRESH_TOKEN: ${{ secrets.BLOGGER_REFRESH_TOKEN }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          OPENVERSE_CLIENT_ID: ${{ secrets.OPENVERSE_CLIENT_ID }}
          OPENVERSE_CLIENT_SECRET: ${{ secrets.OPENVERSE_CLIENT_SECRET }}
          # بغیر اینکر انداز (NEWS_STYLE: explainer, NEWS_ANCHOR: "off", NEWS_ORDER: cold) — مالک کے اطمینان تک صرف نمونوں میں
        run: |
          set +e
          python -m news.bulletin ${{ github.event.inputs.force == 'yes' && 'force' || '' }}; rc=$?
          [ $rc = 0 ] || { [ -f state/news_error.txt ] && grep -E "Error|error|File \"/home" state/news_error.txt | tail -6 | while IFS= read -r l; do echo "::notice::$l"; done; }
          exit $rc
      - name: Keep a review copy
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ -f bulletin.mp4 ] || exit 0
          T="bulletin-$(TZ=Asia/Riyadh date +%F)"
          gh release delete "$T" -y --cleanup-tag 2>/dev/null || true
          gh release create "$T" --title "$T" --notes "review copy" bulletin.mp4 || true
      - name: Save
        if: always()
        run: |
          git config user.name "ai-news-bot"
          git config user.email "ai-news-bot@users.noreply.github.com"
          for f in state/news.json state/news_error.txt state/tts_usage.json state/tts_usage_*.json state/tts_backup.json; do [ -f "$f" ] && git add "$f"; done; git add -A state/seo state/blog_queue media 2>/dev/null || true; true
          git add -A cache state/script_*.json state/hook_bank.json state/competitor_ids.json 2>/dev/null || true
          git diff --cached --quiet && exit 0
          git commit -m "بلیٹن"
          for i in 1 2 3; do git pull --rebase --autostash -X theirs && git push && exit 0; sleep 10; done; echo "push ناکام"; exit 1

      - name: Alert on failure
        if: failure()
        env:
          TOKEN: ${{ secrets.NEWS_BOT_TOKEN || secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_SECRET: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          CHAT=$(python3 -c "import json;print(json.load(open('state/news.json')).get('chat',''))" 2>/dev/null); CHAT=${CHAT:-$CHAT_SECRET}
          curl -s -X POST "https://api.telegram.org/bot$TOKEN/sendMessage" --data-urlencode "chat_id=$CHAT" \
            --data-urlencode "text=⚠️ اے آئی نیوز: «${{ github.workflow }}» ناکام ہو گیا۔ یہ لنک Jules یا Claude کو دکھائیں: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" >/dev/null || true
