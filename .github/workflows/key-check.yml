# 🔑 Gemini چابیوں کی جانچ — صرف ماڈلز کی فہرست مانگتا ہے (کوئی کوٹا خرچ نہیں)، نتیجہ ٹیلیگرام پر
name: Gemini key check
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check keys
        env:
          K_BULLETIN: ${{ secrets.GEMINI_TTS_BULLETIN }}
          K_FLASH: ${{ secrets.GEMINI_TTS_FLASH }}
          K_PODCAST: ${{ secrets.GEMINI_TTS_PODCAST }}
          K_MAIN: ${{ secrets.GEMINI_API_KEY }}
          K_BACKUP: ${{ secrets.GEMINI_BACKUP_KEY }}
          NAWA_TOKEN: ${{ secrets.NAWA_TOKEN }}
          TOKEN: ${{ secrets.NEWS_BOT_TOKEN || secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_SECRET: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          msg="🔑 Gemini چابیوں کی جانچ (کوٹا خرچ نہیں):"
          for n in BULLETIN FLASH PODCAST MAIN BACKUP; do
            v="K_$n"; k="${!v}"
            if [ -z "$k" ]; then r="❌ Secret خالی/موجود نہیں"
            else
              c=$(curl -s -o out.json -w "%{http_code}" -H "x-goog-api-key: $k" "https://generativelanguage.googleapis.com/v1beta/models?pageSize=200")
              tts=$(grep -c "preview-tts" out.json || true)
              p=$(printf %s "$k" | cut -c1-4)
              [ "$c" = "200" ] && r="✅ ٹھیک ($p… | آواز ماڈل: $tts)" || r="❌ HTTP $c: $(grep -o '"message": *"[^"]*' out.json | head -1 | cut -c13-120)"
            fi
            echo "$n: $r"; msg="$msg"$'\n'"$n: $r"
          done
          # NAWA_TOKEN: نوائے فاروقی کے نجی ریپو تک رسائی (کلون + پُش اجازت + Actions پڑھنا)
          if [ -z "$NAWA_TOKEN" ]; then r="❌ Secret خالی"
          else
            if git ls-remote "https://x-access-token:${NAWA_TOKEN}@github.com/nawaefarooqi-bit/nawaefarooqi-agents" HEAD >/dev/null 2>gerr; then c=ok; else c=no; echo "git: $(head -c 300 gerr)"; fi
            ct=$(curl -s -o /dev/null -w "%{http_code}" -H "Authorization: Bearer $NAWA_TOKEN" "https://api.github.com/repos/nawaefarooqi-bit/nawaefarooqi-agents/contents/")
            echo "contents api: $ct"; curl -s -I -H "Authorization: Bearer $NAWA_TOKEN" https://api.github.com/repos/nawaefarooqi-bit/nawaefarooqi-agents | grep -i "x-accepted-github-permissions\|github-authentication-token-expiration\|x-oauth"
            pu=$(curl -s -H "Authorization: Bearer $NAWA_TOKEN" https://api.github.com/repos/nawaefarooqi-bit/nawaefarooqi-agents | python3 -c "import json,sys;print(json.load(sys.stdin).get('permissions',{}).get('push'))" 2>/dev/null)
            ac=$(curl -s -o /dev/null -w "%{http_code}" -H "Authorization: Bearer $NAWA_TOKEN" "https://api.github.com/repos/nawaefarooqi-bit/nawaefarooqi-agents/actions/runs?per_page=1")
            [ "$c" = ok ] && [ "$pu" = True ] && [ "$ac" = 200 ] && r="✅ ٹھیک (کلون، پُش، Actions)" || r="❌ کلون:$c مواد:$ct Actions:$ac"
          fi
          echo "NAWA_TOKEN: $r"; msg="$msg"$'\n'"NAWA_TOKEN: $r"
          CHAT=$(python3 -c "import json;print(json.load(open('state/news.json')).get('chat',''))" 2>/dev/null); CHAT=${CHAT:-$CHAT_SECRET}
          curl -s -d "chat_id=$CHAT" --data-urlencode "text=$msg" "https://api.telegram.org/bot$TOKEN/sendMessage" >/dev/null
