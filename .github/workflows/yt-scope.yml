name: yt-scope (temporary)
on: { push: { paths: [".github/workflows/yt-scope.yml"] } }
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - env:
          A_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          A_SEC: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          A_TOK: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          T_ID: ${{ secrets.TS_YOUTUBE_CLIENT_ID }}
          T_SEC: ${{ secrets.TS_YOUTUBE_CLIENT_SECRET }}
          T_TOK: ${{ secrets.TS_YOUTUBE_REFRESH_TOKEN }}
          N_ID: ${{ secrets.NAWA_YOUTUBE_CLIENT_ID }}
          N_SEC: ${{ secrets.NAWA_YOUTUBE_CLIENT_SECRET }}
          N_TOK: ${{ secrets.NAWA_YOUTUBE_REFRESH_TOKEN }}
        run: |
          python3 - <<'PY'
          import os, json, hashlib, urllib.request, urllib.parse
          for p, name in (("A", "AI News"), ("T", "Toolscape"), ("N", "Nawa")):
              cid = os.environ[p+"_ID"].strip()
              d = urllib.parse.urlencode({"client_id": cid, "client_secret": os.environ[p+"_SEC"].strip(),
                   "refresh_token": os.environ[p+"_TOK"].strip(), "grant_type": "refresh_token"}).encode()
              r = json.load(urllib.request.urlopen("https://oauth2.googleapis.com/token", d, timeout=30))
              print(name, "| client project:", cid.split("-")[0], "| client hash:", hashlib.sha256(cid.encode()).hexdigest()[:6], "| SCOPES:", r.get("scope"))
          PY
