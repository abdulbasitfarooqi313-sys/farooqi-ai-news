name: yt-scope (temporary)
on: { push: { paths: [".github/workflows/yt-scope.yml"] } }
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - env:
          A_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          A_SEC: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          A_TOK: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          T_ID: ${{ secrets.TS_YOUTUBE_CLIENT_ID }}
          T_SEC: ${{ secrets.TS_YOUTUBE_CLIENT_SECRET }}
          T_TOK: ${{ secrets.TS_YOUTUBE_REFRESH_TOKEN }}
          N_ID: ${{ secrets.NAWA_YOUTUBE_CLIENT_ID }}
          N_SEC: ${{ secrets.NAWA_YOUTUBE_CLIENT_SECRET }}
          N_TOK: ${{ secrets.NAWA_YOUTUBE_REFRESH_TOKEN }}
        run: |
          python3 - <<'PY'
          import os, json, urllib.request, urllib.parse
          for p, name in (("A", "AI News"), ("T", "Toolscape"), ("N", "Nawa")):
              try:
                  d = urllib.parse.urlencode({"client_id": os.environ[p+"_ID"].strip(), "client_secret": os.environ[p+"_SEC"].strip(),
                       "refresh_token": os.environ[p+"_TOK"].strip(), "grant_type": "refresh_token"}).encode()
                  r = json.load(urllib.request.urlopen("https://oauth2.googleapis.com/token", d, timeout=30))
                  print(name, "SCOPES:", r.get("scope"))
                  tok = r["access_token"]
                  try:
                      q = urllib.parse.urlencode({"ids": "channel==MINE", "startDate": "2026-11-01", "endDate": "2026-11-10", "metrics": "views,averageViewDuration"})
                      req = urllib.request.Request("https://youtubeanalytics.googleapis.com/v2/reports?" + q, headers={"Authorization": "Bearer " + tok})
                      print(name, "ANALYTICS:", json.load(urllib.request.urlopen(req, timeout=30)).get("rows"))
                  except Exception as e:
                      print(name, "ANALYTICS FAIL:", getattr(e, "code", e), (e.read().decode()[:160] if hasattr(e, "read") else ""))
              except Exception as e:
                  print(name, "TOKEN FAIL:", getattr(e, "code", e))
          PY
