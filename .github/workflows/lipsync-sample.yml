# 🎙️ نمونہ (مالک 10 نومبر): دو AI اینکرز اردو (Microsoft آواز) میں — ہونٹ Kaggle کے مفت GPU پر LatentSync سے۔ روز کے نظام سے الگ۔
name: Lipsync sample
on: workflow_dispatch
permissions: {}
jobs:
  s:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Engine
        env: { ENGINE_TOKEN: "${{ secrets.ENGINE_TOKEN }}" }
        run: |
          git clone -q --depth 1 "https://x-access-token:${ENGINE_TOKEN}@github.com/abdulbasitfarooqi313-sys/farooqi-ai-news-engine" eng
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null
          pip install -q edge-tts kaggle six
      - name: Prep (voice + crops)
        working-directory: eng
        run: python -u lab/lipsync/prep.py lab/lipsync/src.mp4 /tmp/w
      - name: Kaggle (free GPU)
        env: { KAGGLE_API_TOKEN: "${{ secrets.KAGGLE_KEY }}", KAGGLE_USERNAME: "${{ secrets.KAGGLE_USERNAME }}" }
        run: |
          set -e
          U="$KAGGLE_USERNAME"; D=/tmp/ds; K=/tmp/kn; mkdir -p $D $K
          cp /tmp/w/f_crop.mp4 /tmp/w/m_crop.mp4 /tmp/w/f.wav /tmp/w/m.wav $D/
          printf '{"title":"farooqi-lipsync-in","id":"%s/farooqi-lipsync-in","licenses":[{"name":"CC0-1.0"}]}' "$U" > $D/dataset-metadata.json
          kaggle datasets create -p $D -q 2>&1 | tail -2 || true
          kaggle datasets version -p $D -m "run $GITHUB_RUN_NUMBER" -q 2>&1 | tail -2 || true
          for i in $(seq 1 40); do st=$(kaggle datasets status "$U/farooqi-lipsync-in" 2>&1 | tail -1); echo "dataset: $st"; [ "$st" = ready ] && break; case "$st" in *Error*|*error*) exit 1;; esac; sleep 15; done
          cp eng/lab/lipsync/kaggle_run.py $K/
          printf '{"id":"%s/farooqi-lipsync-sample","title":"farooqi-lipsync-sample","code_file":"kaggle_run.py","language":"python","kernel_type":"script","is_private":true,"enable_gpu":true,"enable_internet":true,"machine_shape":"NvidiaTeslaT4","dataset_sources":["%s/farooqi-lipsync-in"],"competition_sources":[],"kernel_sources":[]}' "$U" "$U" > $K/kernel-metadata.json
          kaggle kernels push -p $K
          for i in $(seq 1 200); do sleep 30; st=$(kaggle kernels status "$U/farooqi-lipsync-sample" 2>&1 | tail -1); echo "$i $st"
            case "$st" in *complete*|*error*|*cancel*) break;; esac; done
          mkdir -p /tmp/ko && kaggle kernels output "$U/farooqi-lipsync-sample" -p /tmp/ko || true
          ls -la /tmp/ko; tail -c 6000 /tmp/ko/*.log 2>/dev/null | tr -d '\r' | tail -60 || true
          cp /tmp/ko/f_out.mp4 /tmp/ko/m_out.mp4 /tmp/w/
      - name: Composite
        working-directory: eng
        run: python -u lab/lipsync/post.py /tmp/w /tmp/w/anchors_sample.mp4
      - name: Send to Telegram
        env: { TOKEN: "${{ secrets.TELEGRAM_BOT_TOKEN }}", CHAT: "${{ secrets.TELEGRAM_CHAT_ID }}" }
        run: |
          curl -s -F "chat_id=$CHAT" -F "video=@/tmp/w/anchors_sample.mp4" -F "supports_streaming=true" \
            -F "caption=🎙️ نمونہ: دو AI اینکر اردو میں (Microsoft آواز، ہونٹ Kaggle GPU پر LatentSync سے) — صرف آزمائش، کہیں شائع نہیں" \
            "https://api.telegram.org/bot$TOKEN/sendVideo" | head -c 200
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: lipsync-sample, path: /tmp/w/anchors_sample.mp4, if-no-files-found: ignore }
