name: Channel trailer (one-off)
on:
  workflow_dispatch:
  push:
    paths: [".github/workflows/trailer.yml", "lab/trailer/**"]
permissions:
  contents: write
jobs:
  trailer:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -q -r requirements.txt && sudo apt-get install -y -qq ffmpeg >/dev/null
      - env:
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
        run: |
          set +e
          python -u lab/trailer/trailer.py > out.txt 2>&1; rc=$?
          grep -E "TRAILER|photo fail|Error|Traceback" out.txt | head -8 | while IFS= read -r l; do echo "::notice::$l"; done
          exit $rc
      - env: { GH_TOKEN: "${{ github.token }}" }
        run: gh release create "trailer-$(date -u +%H%M)" --draft --title trailer -n "channel trailer (review)" trailer.mp4
