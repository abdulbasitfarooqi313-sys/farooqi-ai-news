name: YouTube key check
on:
  workflow_dispatch:
  push:
    paths: [".github/workflows/yt-check.yml", "lab/yt_check.py", "lab/pixabay_check.py", "lab/backup_key_check.py", "lab/blog_check.py", "lab/yt_token_check.py", "lab/yt_status.py", "news/blog.py", "lab/blog_backfill.py"]
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install requests pillow
      - run: |
          set +e
          PYTHONPATH=. python lab/blog_backfill.py > out.txt 2>&1; rc=$?
          while IFS= read -r l; do echo "::notice::$l"; done < out.txt
          exit $rc
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          BLOGGER_REFRESH_TOKEN: ${{ secrets.BLOGGER_REFRESH_TOKEN }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          GEMINI_BACKUP_KEY: ${{ secrets.GEMINI_BACKUP_KEY }}
      - name: Save
        if: always()
        run: |
          git config user.name "ai-news-bot"; git config user.email "ai-news-bot@users.noreply.github.com"
          git add state/blog.json 2>/dev/null || true; git add -A state/blog_queue 2>/dev/null || true
          git diff --cached --quiet && exit 0
          git commit -m "بلاگ: پرانا مواد"
          for i in 1 2 3; do git pull --rebase --autostash -X theirs && git push && exit 0; sleep 5; done
