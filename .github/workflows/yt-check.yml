name: YouTube key check
on:
  workflow_dispatch:
  push:
    paths: [".github/workflows/yt-check.yml", "lab/yt_check.py", "lab/pixabay_check.py"]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install requests
      - run: |
          set +e
          python lab/pixabay_check.py > out.txt 2>&1; rc=$?
          while IFS= read -r l; do echo "::notice::$l"; done < out.txt
          exit $rc
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
