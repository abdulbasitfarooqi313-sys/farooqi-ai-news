name: Preview bulletin (sample)
on:
  workflow_dispatch:
    inputs:
      anchor:
        description: "on / off"
        default: "off"
      style:
        description: "tv / explainer"
        default: "explainer"
      keyed:
        description: "1 = magenta boxes for b-roll"
        default: "0"
permissions:
  contents: write
jobs:
  p:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Engine (private code)
        env: { ENGINE_TOKEN: "${{ secrets.ENGINE_TOKEN }}" }
        run: |
          if [ -n "$ENGINE_TOKEN" ]; then
            if git clone -q --depth 1 "https://x-access-token:${ENGINE_TOKEN}@github.com/abdulbasitfarooqi313-sys/farooqi-ai-news-engine" /tmp/engine; then
              rsync -a --exclude .git --exclude .gitignore --exclude .github --exclude state --exclude media --exclude cache --exclude desk /tmp/engine/ ./
              rm -rf /tmp/engine; echo "engine: ok"
            else
              code=$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $ENGINE_TOKEN" https://api.github.com/repos/abdulbasitfarooqi313-sys/farooqi-ai-news-engine)
              echo "::warning::engine clone failed (api $code, token len ${#ENGINE_TOKEN}, prefix ${ENGINE_TOKEN:0:11}) — using code in this repo"
              [ -f news/bulletin.py ] || exit 1
            fi
          else echo "::warning::ENGINE_TOKEN missing — using code in this repo"; fi
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt && sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: python -m playwright install --with-deps chromium || true
      - env:
          GEMINI_NEWS_KEY: ${{ secrets.GEMINI_NEWS_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          OPENVERSE_CLIENT_ID: ${{ secrets.OPENVERSE_CLIENT_ID }}
          OPENVERSE_CLIENT_SECRET: ${{ secrets.OPENVERSE_CLIENT_SECRET }}
        run: PYTHONPATH=. NEWS_ANCHOR=${{ inputs.anchor }} KEYED=${{ inputs.keyed }} NEWS_STYLE=${{ inputs.style }} FORCE_KEY=1 python -u lab/preview.py 2>&1 | tee preview.log
      - if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          T=preview-${{ github.run_number }}
          F=$(ls out/preview.mp4 out/thumb.jpg out/tl.json out/ranges.json 2>/dev/null || true); gh release create "$T" $F preview.log --prerelease --title "$T" --notes sample || gh release create "$T" preview.log --prerelease --title "$T" --notes failed
