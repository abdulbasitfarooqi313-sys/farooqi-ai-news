name: Preview bulletin (sample)
on:
  workflow_dispatch:
    inputs:
      anchor:
        description: "on / off"
        default: "off"
      style:
        description: "tv / explainer"
        default: "explainer"
      keyed:
        description: "1 = magenta boxes for b-roll"
        default: "0"
permissions:
  contents: write
jobs:
  p:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt && sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: python -m playwright install --with-deps chromium || true
      - run: PYTHONPATH=. NEWS_ANCHOR=${{ inputs.anchor }} KEYED=${{ inputs.keyed }} NEWS_STYLE=${{ inputs.style }} FORCE_KEY=1 python -u lab/preview.py 2>&1 | tee preview.log
      - if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          T=preview-${{ github.run_number }}
          gh release create "$T" out/preview.mp4 out/thumb.jpg out/tl.json out/ranges.json preview.log --prerelease --title "$T" --notes sample || gh release create "$T" preview.log --prerelease --title "$T" --notes failed
