# ⚡ اے آئی فلیش — اتوار، منگل، جمعرات: 15–20 ریپڈ فائر سرخیاں (کھڑی ویڈیو / شارٹ) → ٹیلیگرام ✅/❌ + یوٹیوب Private → ✅ پر شام 5 بجے
name: AI Flash


on:
  schedule:
    - cron: "0 12 * * 0,2,4"   # 3:00 سہ پہر (سعودی)
    - cron: "0 14 * * 0,2,4"   # 5:00 — نہ بنا ہو تو
    - cron: "0 16 * * 0,2,4"   # 7:00 — آخری کوشش
  push:
    paths: ["state/flash_run_now"]      # فوری رن (GitHub کا شیڈول دیر کرے تو)
  workflow_dispatch:
    inputs:
      force:
        description: "دوبارہ بنائیں: yes"
        required: false
        default: "no"

permissions:
  contents: write

concurrency:
  group: bulletin
  cancel-in-progress: false

jobs:
  flash:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Make flash
        env:
          GEMINI_NEWS_KEY: ${{ secrets.GEMINI_NEWS_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_BACKUP_KEY: ${{ secrets.GEMINI_BACKUP_KEY }}
          NEWS_BOT_TOKEN: ${{ secrets.NEWS_BOT_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: python -m news.flash ${{ github.event.inputs.force == 'yes' && 'force' || '' }}
      - name: Keep a review copy
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ -f flash.mp4 ] || exit 0
          T="flash-$(TZ=Asia/Riyadh date +%F)"
          gh release delete "$T" -y --cleanup-tag 2>/dev/null || true
          gh release create "$T" --title "$T" --notes "review copy" flash.mp4 || true
      - name: Save
        if: always()
        run: |
          git config user.name "ai-news-bot"
          git config user.email "ai-news-bot@users.noreply.github.com"
          for f in state/news.json state/news_error.txt state/tts_usage.json; do [ -f "$f" ] && git add "$f"; done; true
          git add -A cache state/flash_last.json 2>/dev/null || true
          git diff --cached --quiet && exit 0
          git commit -m "فلیش"
          for i in 1 2 3; do git pull --rebase --autostash -X theirs && git push && exit 0; sleep 10; done; echo "push ناکام"; exit 1

      - name: Alert on failure
        if: failure()
        env:
          TOKEN: ${{ secrets.NEWS_BOT_TOKEN || secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_SECRET: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          CHAT=$(python3 -c "import json;print(json.load(open('state/news.json')).get('chat',''))" 2>/dev/null); CHAT=${CHAT:-$CHAT_SECRET}
          curl -s -X POST "https://api.telegram.org/bot$TOKEN/sendMessage" --data-urlencode "chat_id=$CHAT" \
            --data-urlencode "text=⚠️ اے آئی نیوز: «${{ github.workflow }}» ناکام ہو گیا۔ یہ لنک Jules یا Claude کو دکھائیں: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" >/dev/null || true
