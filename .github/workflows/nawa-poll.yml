# 📨 نوائے فاروقی کا ٹیلیگرام بوٹ (✅/❌ بٹن، ہدایات) — لامحدود منٹوں پر۔ مالک کی ہدایت 12 نومبر 2026:
# «تینوں چینل کے سارے اضافی کام لامحدود والی ریپوزٹری سے»۔ نجی ریپو کا telegram-poll.yml بند (منٹ بچانے کو)۔
# ہر رن ~24 منٹ تک ہر منٹ بوٹ دیکھتا ہے؛ ہر 20 منٹ نیا رن (قطار میں) — یعنی بٹن کا جواب تقریباً ایک منٹ میں۔
# صبح 05:00Z والا رن تلاوت شیٹ (recite_sheet --auto) بھی بھیجتا ہے۔
# کوڈ نجی ریپو سے (NAWA_TOKEN)، راز NAWA_ سابقے سے، ریکارڈ (state) واپس نجی ریپو میں۔ لاگ میں کوئی راز نہیں۔
name: Nawa bot
on:
  schedule:
    - cron: "*/20 * * * *"
    - cron: "0 5 * * *"
  workflow_dispatch:
    inputs:
      cmd: { description: "خالی = بوٹ؛ یا کوئی ماڈیول، مثلاً nawa.yt_check", required: false, default: "" }
permissions:
  contents: read
concurrency:
  group: nawa-bot
  cancel-in-progress: false
jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      GEMINI_API_KEY: ${{ secrets.NAWA_GEMINI_API_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.NAWA_TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.NAWA_TELEGRAM_CHAT_ID }}
      GDRIVE_SERVICE_ACCOUNT_JSON: ${{ secrets.NAWA_GDRIVE_SERVICE_ACCOUNT_JSON }}
      BLOGGER_CLIENT_ID: ${{ secrets.NAWA_BLOGGER_CLIENT_ID }}
      BLOGGER_CLIENT_SECRET: ${{ secrets.NAWA_BLOGGER_CLIENT_SECRET }}
      BLOGGER_REFRESH_TOKEN: ${{ secrets.NAWA_BLOGGER_REFRESH_TOKEN }}
      BLOGGER_BLOG_ID: ${{ secrets.NAWA_BLOGGER_BLOG_ID }}
      YOUTUBE_REFRESH_TOKEN: ${{ secrets.NAWA_YOUTUBE_REFRESH_TOKEN }}
      YOUTUBE_CLIENT_ID: ${{ secrets.NAWA_YOUTUBE_CLIENT_ID }}
      YOUTUBE_CLIENT_SECRET: ${{ secrets.NAWA_YOUTUBE_CLIENT_SECRET }}
      ANTHROPIC_API_KEY: ${{ secrets.NAWA_ANTHROPIC_API_KEY }}
      FB_PAGE_ID: ${{ secrets.NAWA_FB_PAGE_ID }}
      FB_PAGE_TOKEN: ${{ secrets.NAWA_FB_PAGE_TOKEN }}
      IG_USER_ID: ${{ secrets.NAWA_IG_USER_ID }}
      LINKEDIN_TOKEN: ${{ secrets.NAWA_LINKEDIN_TOKEN }}
      LINKEDIN_AUTHOR: ${{ secrets.NAWA_LINKEDIN_AUTHOR }}
      X_API_KEY: ${{ secrets.NAWA_X_API_KEY }}
      X_API_SECRET: ${{ secrets.NAWA_X_API_SECRET }}
      X_ACCESS_TOKEN: ${{ secrets.NAWA_X_ACCESS_TOKEN }}
      X_ACCESS_SECRET: ${{ secrets.NAWA_X_ACCESS_SECRET }}
    steps:
      - name: Nawa code (private)
        env: { NAWA_TOKEN: "${{ secrets.NAWA_TOKEN }}" }
        run: |
          [ -n "$NAWA_TOKEN" ] || { echo "::error::NAWA_TOKEN نہیں"; exit 1; }
          git clone -q "https://x-access-token:${NAWA_TOKEN}@github.com/nawaefarooqi-bit/nawaefarooqi-agents" nawa-repo
          cd nawa-repo && git config user.name "nawa-bot" && git config user.email "nawa-bot@users.noreply.github.com"
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: cd nawa-repo && pip install -q -r requirements.txt
      - name: Cache Drive PDFs
        uses: actions/cache@v4
        with:
          path: nawa-repo/data/drive
          key: nawa-drive-${{ github.run_id }}
          restore-keys: nawa-drive-
      - name: Bot loop
        working-directory: nawa-repo
        env:
          NAWA_TOKEN: ${{ secrets.NAWA_TOKEN }}
          CMD: ${{ github.event.inputs.cmd }}
          WHEN: ${{ github.event.schedule }}
        run: |
          save() {
            git add -A
            git diff --cached --quiet && return 0
            git commit -q -m "${1:-ٹیلیگرام: حیثیت کی تجدید} (لامحدود رنر)"
            for i in 1 2 3; do git pull -q --rebase --autostash -X theirs && git push -q && return 0; sleep 10; done
            echo "::warning::push ناکام"
          }
          redo() {   # ✏️ اصلاح کے بعد ویڈیو والا رن — ویڈیو اپنے منٹوں پر (ختم ہوں تو متبادل خود سنبھالتا ہے)
            [ -f /tmp/nawa_dispatch ] || return 0
            sort -u /tmp/nawa_dispatch | while read wf; do
              curl -s -o /dev/null -w "redo $wf: %{http_code}\n" -X POST -H "Authorization: Bearer $NAWA_TOKEN" \
                -H "Accept: application/vnd.github+json" \
                "https://api.github.com/repos/nawaefarooqi-bit/nawaefarooqi-agents/actions/workflows/$wf/dispatches" -d '{"ref":"main"}'
            done
            rm -f /tmp/nawa_dispatch
          }
          if [ -n "$CMD" ]; then python -u -m $CMD; save "جانچ: $CMD"; exit 0; fi
          if [ "$WHEN" = "0 5 * * *" ]; then python -m nawa.recite_sheet --auto || true; save "پڑھنے والا صفحہ بھیجا"; fi
          end=$(( $(date +%s) + 24*60 ))
          while [ $(date +%s) -lt $end ]; do
            git pull -q --rebase --autostash -X theirs || true    # نجی ویڈیو رنز کا تازہ ریکارڈ
            python -m nawa.bot poll || echo "::warning::poll ناکام (اگلے منٹ دوبارہ)"
            save; redo
            sleep 50
          done
      - name: Alert on failure
        if: failure()
        env:
          TOKEN: ${{ secrets.NAWA_TELEGRAM_BOT_TOKEN }}
          CHAT: ${{ secrets.NAWA_TELEGRAM_CHAT_ID }}
        run: |
          curl -s -X POST "https://api.telegram.org/bot$TOKEN/sendMessage" --data-urlencode "chat_id=$CHAT" \
            --data-urlencode "text=⚠️ نوائے فاروقی: بوٹ (لامحدود رنر) ناکام ہو گیا۔ یہ لنک Claude کو دکھائیں: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" >/dev/null || true
