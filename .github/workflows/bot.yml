# @farooqi_ai_news_bot کے بٹن: ✅ منظور · ❌ دوبارہ · ویڈیو پر Reply = ہدایت کے ساتھ نیا بلیٹن
name: Bot

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: bot
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Engine (private code)
        env: { ENGINE_TOKEN: "${{ secrets.ENGINE_TOKEN }}" }
        run: |
          if [ -n "$ENGINE_TOKEN" ]; then
            if git clone -q --depth 1 "https://x-access-token:${ENGINE_TOKEN}@github.com/abdulbasitfarooqi313-sys/farooqi-ai-news-engine" /tmp/engine; then
              rsync -a --exclude .git --exclude .gitignore --exclude .github --exclude state --exclude media --exclude cache --exclude desk /tmp/engine/ ./
              rm -rf /tmp/engine; echo "engine: ok"
            else
              code=$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $ENGINE_TOKEN" https://api.github.com/repos/abdulbasitfarooqi313-sys/farooqi-ai-news-engine)
              echo "::warning::engine clone failed (api $code, token len ${#ENGINE_TOKEN}, prefix ${ENGINE_TOKEN:0:11}) — using code in this repo"
              [ -f news/bulletin.py ] || exit 1
            fi
          else echo "::warning::ENGINE_TOKEN missing — using code in this repo"; fi
      - name: Toolscape code (private) — its ✅/❌ handled here instantly
        env: { TS_TOKEN: "${{ secrets.TS_TOKEN }}" }
        run: |
          [ -n "$TS_TOKEN" ] || exit 0
          git clone -q --depth 1 "https://x-access-token:${TS_TOKEN}@github.com/hellotoolscape/ai-tube-factory" ts && echo "toolscape: ok" || echo "::warning::toolscape clone failed"
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -q requests
      - name: Buttons
        env:
          NEWS_BOT_TOKEN: ${{ secrets.NEWS_BOT_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          BLOGGER_REFRESH_TOKEN: ${{ secrets.BLOGGER_REFRESH_TOKEN }}
          TOOLSCAPE_BOT_TOKEN: ${{ secrets.TOOLSCAPE_BOT_TOKEN }}
          TOOLSCAPE_GH_TOKEN: ${{ secrets.TOOLSCAPE_GH_TOKEN }}
          TS_TELEGRAM_BOT_TOKEN: ${{ secrets.TS_TELEGRAM_BOT_TOKEN }}
          TS_TELEGRAM_CHAT_ID: ${{ secrets.TS_TELEGRAM_CHAT_ID }}
          TS_YOUTUBE_CLIENT_ID: ${{ secrets.TS_YOUTUBE_CLIENT_ID }}
          TS_YOUTUBE_CLIENT_SECRET: ${{ secrets.TS_YOUTUBE_CLIENT_SECRET }}
          TS_YOUTUBE_REFRESH_TOKEN: ${{ secrets.TS_YOUTUBE_REFRESH_TOKEN }}
          TS_BLOGGER_REFRESH_TOKEN: ${{ secrets.TS_BLOGGER_REFRESH_TOKEN }}
          TS_GEMINI_API_KEY: ${{ secrets.TS_GEMINI_API_KEY }}
          TS_DIR: ts
          BOT_LOOP_MIN: "26"
        run: python -m news.bulletin pollloop
      - name: Save
        run: |
          git config user.name "ai-news-bot"
          git config user.email "ai-news-bot@users.noreply.github.com"
          git add state/news.json || true; git add state/yt_public.json 2>/dev/null || true; git add state/public_watch.json 2>/dev/null || true; git add state/blog.json 2>/dev/null || true; git add -A state/blog_queue 2>/dev/null || true
          git diff --cached --quiet && exit 0
          git commit -m "بوٹ: حیثیت"
          for i in 1 2 3; do git pull --rebase --autostash -X theirs && git push && exit 0; sleep 10; done; exit 1
      - name: Start new bulletin / roundup (❌)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ -f /tmp/news_dispatch ] || exit 0
          for wf in $(sort -u /tmp/news_dispatch); do gh workflow run "$wf" --ref "${{ github.ref_name }}" -f force=yes; done

      - name: Next listener (continuous ✅/❌ — public repo, unlimited minutes)
        if: always() && !cancelled()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run bot.yml --ref "${{ github.ref_name }}" || true

      - name: Alert on failure
        if: failure()
        env:
          TOKEN: ${{ secrets.NEWS_BOT_TOKEN || secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_SECRET: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          CHAT=$(python3 -c "import json;print(json.load(open('state/news.json')).get('chat',''))" 2>/dev/null); CHAT=${CHAT:-$CHAT_SECRET}
          curl -s -X POST "https://api.telegram.org/bot$TOKEN/sendMessage" --data-urlencode "chat_id=$CHAT" \
            --data-urlencode "text=⚠️ اے آئی نیوز: «${{ github.workflow }}» ناکام ہو گیا۔ یہ لنک Jules یا Claude کو دکھائیں: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" >/dev/null || true
