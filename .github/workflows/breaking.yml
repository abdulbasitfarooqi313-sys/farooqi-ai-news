# 🚨 بریکنگ نیوز — روزانہ ایک شارٹ (30–40s): اے آئی/ٹیک کی سب سے بڑی تازہ خبر → ٹیلیگرام ✅/❌ + یوٹیوب Private → ✅ پر فوراً پبلک (مالک، 15 نومبر 2026)
name: Breaking News


on:
  schedule:
    - cron: "20 6 * * *"      # 9:20 صبح (سعودی) — رات بھر کی امریکی خبریں تازہ؛ ✅ کے بعد فوراً پبلک
    - cron: "20 8 * * *"      # 11:20 — نہ بنی ہو تو
    - cron: "20 10 * * *"     # 1:20 — آخری کوشش
  workflow_dispatch:
    inputs:
      force:
        description: "دوبارہ بنائیں: yes | نمونہ: sample"
        required: false
        default: "no"

permissions:
  contents: write

concurrency:
  group: bulletin
  cancel-in-progress: false

jobs:
  breaking:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Engine (private code)
        env: { ENGINE_TOKEN: "${{ secrets.ENGINE_TOKEN }}" }
        run: |
          if [ -n "$ENGINE_TOKEN" ]; then
            if git clone -q --depth 1 "https://x-access-token:${ENGINE_TOKEN}@github.com/abdulbasitfarooqi313-sys/farooqi-ai-news-engine" /tmp/engine; then
              rsync -a --exclude .git --exclude .gitignore --exclude .github --exclude state --exclude media --exclude cache --exclude desk /tmp/engine/ ./
              rm -rf /tmp/engine; echo "engine: ok"
            else
              code=$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $ENGINE_TOKEN" https://api.github.com/repos/abdulbasitfarooqi313-sys/farooqi-ai-news-engine)
              echo "::warning::engine clone failed (api $code, token len ${#ENGINE_TOKEN}, prefix ${ENGINE_TOKEN:0:11}) — using code in this repo"
              [ -f news/bulletin.py ] || exit 1
            fi
          else echo "::warning::ENGINE_TOKEN missing — using code in this repo"; fi
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: LLM cache (restore)            # 🧠 ٹوکن بچت: رنز کے درمیان Gemini جواب کا کیشے
        uses: actions/cache/restore@v4
        with:
          path: cache/llm
          key: llm-breaking-${{ github.run_id }}
          restore-keys: llm-breaking-
      - name: Make breaking
        env:
          GEMINI_NEWS_KEY: ${{ secrets.GEMINI_NEWS_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_TTS_KEY: ${{ secrets.GEMINI_TTS_FLASH }}     # اس کام کی آواز کا اپنا پروجیکٹ
          TTS_JOB: breaking
          GEMINI_BACKUP_KEY: ${{ secrets.GEMINI_BACKUP_KEY }}
          NEWS_BOT_TOKEN: ${{ secrets.NEWS_BOT_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          OPENVERSE_CLIENT_ID: ${{ secrets.OPENVERSE_CLIENT_ID }}
          OPENVERSE_CLIENT_SECRET: ${{ secrets.OPENVERSE_CLIENT_SECRET }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          BLOGGER_REFRESH_TOKEN: ${{ secrets.BLOGGER_REFRESH_TOKEN }}
        run: BREAKING_ROTATE=1 python -m news.breaking ${{ github.event.inputs.force == 'yes' && 'force' || (github.event.inputs.force == 'sample' && 'sample' || '') }}
      - name: Keep a review copy
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ -f breaking.mp4 ] || exit 0
          T="breaking-$(TZ=Asia/Riyadh date +%F)"      # Facebook ایجنٹ یہی نام ڈھونڈتا ہے
          [ "${{ github.event.inputs.force }}" = sample ] && T="breaking-sample-${{ github.run_number }}"
          gh release delete "$T" -y --cleanup-tag 2>/dev/null || true
          gh release create "$T" --title "$T" --notes "review copy" breaking.mp4 breaking_thumb.jpg || true
      - name: LLM cache (save)
        if: always()
        uses: actions/cache/save@v4
        with:
          path: cache/llm
          key: llm-breaking-${{ github.run_id }}
      - name: Save
        if: always()
        run: |
          git config user.name "ai-news-bot"
          git config user.email "ai-news-bot@users.noreply.github.com"
          for f in state/news.json state/news_error.txt state/tts_usage.json state/tts_usage_*.json state/tts_backup.json; do [ -f "$f" ] && git add "$f"; done; git add -A state/seo state/blog_queue media 2>/dev/null || true; true
          git add -A cache state/breaking_used.json state/palette.json 2>/dev/null || true; git add state/themes.json 2>/dev/null || true
          git diff --cached --quiet && exit 0
          git commit -m "بریکنگ نیوز"
          for i in 1 2 3; do git pull --rebase --autostash -X theirs && git push && exit 0; sleep 10; done; echo "push ناکام"; exit 1

      - name: Alert on failure
        if: failure()
        env:
          TOKEN: ${{ secrets.NEWS_BOT_TOKEN || secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_SECRET: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          CHAT=$(python3 -c "import json;print(json.load(open('state/news.json')).get('chat',''))" 2>/dev/null); CHAT=${CHAT:-$CHAT_SECRET}
          curl -s -X POST "https://api.telegram.org/bot$TOKEN/sendMessage" --data-urlencode "chat_id=$CHAT" \
            --data-urlencode "text=⚠️ اے آئی نیوز: «${{ github.workflow }}» ناکام ہو گیا۔ یہ لنک Jules یا Claude کو دکھائیں: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" >/dev/null || true
