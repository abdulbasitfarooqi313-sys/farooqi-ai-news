# 🔁 نگران: ناکام ویڈیو/کام خود دوبارہ (تینوں چینل) — ہر 20 منٹ؛ تفصیل tools/watchdog.py
name: Watchdog
on:
  schedule:
    - cron: "6,26,46 * * * *"
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency: watchdog
jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Check + retry
        env:
          GH_TOKEN: ${{ github.token }}
          TS_TOKEN: ${{ secrets.TS_TOKEN }}
          NAWA_TOKEN: ${{ secrets.NAWA_TOKEN }}
          NEWS_BOT_TOKEN: ${{ secrets.NEWS_BOT_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python3 -u tools/watchdog.py
      - name: Save
        if: always()
        run: |
          git config user.name "news-bot"; git config user.email "news-bot@users.noreply.github.com"
          git add state/watchdog.json 2>/dev/null || true
          git diff --cached --quiet && exit 0
          git commit -qm "نگران"
          for i in 1 2 3; do git pull -q --rebase --autostash -X theirs && git push -q && exit 0; sleep 5; done
