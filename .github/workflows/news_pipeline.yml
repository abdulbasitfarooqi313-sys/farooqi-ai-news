name: Daily AI News

# روزانہ صبح 7 بجے (سعودی وقت) = 04:00 UTC
on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: ai-news
  cancel-in-progress: false

jobs:
  news:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-lipsync.txt

      - name: Install requirements
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Fetch news, write Urdu bulletin, send to Telegram
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_CHANNEL: ${{ secrets.TELEGRAM_CHANNEL }}
          LIPSYNC: "0"          # ہونٹوں کی AI (MuseTalk) بغیر GPU بہت سست — فی الحال بند؛ نمونہ: Lip-sync sample
        shell: bash
        run: python script.py 2>&1 | tee run.log; exit ${PIPESTATUS[0]}

      - name: Remember sent news (no repeats tomorrow)
        run: |
          git config user.name "ai-news-bot"
          git config user.email "ai-news-bot@users.noreply.github.com"
          git add history.json
          git diff --cached --quiet && exit 0
          git commit -m "خبریں بھیجی گئیں"
          for i in 1 2 3; do git pull --rebase -X theirs && git push && exit 0; sleep 5; done

      - name: Report the error (as a GitHub issue)
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          { echo "رن ناکام ہوا۔ آخری سطریں:"; echo '```'; tail -40 run.log 2>/dev/null; echo '```'; } > err.md
          gh issue create --title "AI News run failed $(date -u +%F)" --body-file err.md || true
