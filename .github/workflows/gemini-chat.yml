# 💬 «فاروقی جیمنائی» ٹیلیگرام بوٹ — مالک کے پیغام جیمنائی انجینئر (engine Issue) تک، ✅/❌ سے PR مرج (پبلک ریپو: لامحدود منٹ)
name: Gemini chat
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
permissions:
  contents: write
  actions: write
  pull-requests: write
concurrency:
  group: gemini-chat
  cancel-in-progress: false
jobs:
  listen:
    runs-on: ubuntu-latest
    timeout-minutes: 32
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -q requests
      - name: Listen
        env:
          GEMINI_BOT_TOKEN: ${{ secrets.GEMINI_BOT_TOKEN }}
          GEMINI_CHAT_GH: ${{ secrets.GEMINI_CHAT_GH }}
          NAWA_TOKEN: ${{ secrets.NAWA_TOKEN }}
          TS_TOKEN: ${{ secrets.TS_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          [ -n "$GEMINI_BOT_TOKEN" ] && [ -n "$GEMINI_CHAT_GH" ] || { echo "::warning::GEMINI_BOT_TOKEN / GEMINI_CHAT_GH missing"; exit 0; }
          python -u tools/gemini_chat.py
      - name: Save
        if: always()
        run: |
          git config user.name "ai-news-bot"; git config user.email "ai-news-bot@users.noreply.github.com"
          git add state/gemini_chat.json 2>/dev/null; git diff --cached --quiet && exit 0
          git commit -q -m "جیمنائی چیٹ: حیثیت"
          for i in 1 2 3; do git pull -q --rebase --autostash -X theirs && git push -q && exit 0; sleep 10; done
      - name: Next listener
        if: always() && !cancelled()
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          [ -n "${{ secrets.GEMINI_BOT_TOKEN }}" ] || exit 0
          gh workflow run gemini-chat.yml --ref "${{ github.ref_name }}" || true
