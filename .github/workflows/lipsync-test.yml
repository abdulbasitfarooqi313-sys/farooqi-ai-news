name: Lipsync test
on:
  workflow_dispatch:
    inputs:
      text:
        description: "اردو جملہ (خالی = نمونہ)"
        required: false
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q ffmpeg
          git clone --depth 1 https://github.com/Rudrabha/Wav2Lip.git
          pip install -q torch==2.1.2 torchvision==0.16.2 --index-url https://download.pytorch.org/whl/cpu
          pip install -q "numpy==1.23.5" "librosa==0.9.2" "opencv-python==4.8.1.78" tqdm numba edge-tts
      - name: Lipsync
        env:
          TEXT: ${{ inputs.text }}
        run: |
          [ -z "$TEXT" ] && unset TEXT
          bash lab/lipsync.sh 2>&1 | tee lipsync.log
      - name: Publish
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=lipsync-test-${{ github.run_number }}
          gh release create "$TAG" out/lipsync-test.mp4 out/right_sync.mp4 lipsync.log --prerelease --title "$TAG" --notes "Wav2Lip test" || \
          gh release create "$TAG" lipsync.log --prerelease --title "$TAG" --notes "failed"
