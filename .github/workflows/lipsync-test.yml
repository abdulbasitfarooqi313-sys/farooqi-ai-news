name: Lip-sync sample

# ہاتھ سے چلائیں: مرد اینکر کا ایک جملہ، ہونٹ آواز کے مطابق (MuseTalk) → ٹیلیگرام
on:
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  sample:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-lipsync.txt
      - name: Install
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install -r requirements.txt -r requirements-lipsync.txt
      - uses: actions/cache@v4
        with:
          path: .musetalk
          key: musetalk-v15-0a89dec
      - name: Make sample
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        shell: bash
        run: timeout 40m python -u lipsync.py test 2>&1 | tee run.log; exit ${PIPESTATUS[0]}
      - name: Report the error
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          { echo "Lip-sync sample failed:"; echo '```'; tail -60 run.log 2>/dev/null; echo '```'; } > err.md
          gh issue create --title "Lip-sync sample failed $(date -u +%F)" --body-file err.md || true
