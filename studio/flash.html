<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:NQ;src:url('__NQFONT__')}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;background:#05070f}
.it{position:absolute;inset:0;opacity:0}
.ph{position:absolute;inset:-60px;background-size:cover;background-position:center;will-change:transform}
.dim{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.35) 0%,rgba(0,0,0,0) 18%,rgba(0,0,0,0) 70%,rgba(0,0,0,.55) 100%)}
/* top band */
#top{position:absolute;left:0;right:0;top:0;height:190px}
#top .plate{position:absolute;right:0;top:0;height:170px;width:820px;background:linear-gradient(90deg,#0a1550,#15286a);clip-path:polygon(9% 0,100% 0,100% 100%,0 100%);border-bottom:6px solid #e2b84f}
#top .chev{position:absolute;right:760px;top:0;height:170px;width:260px}
#top .chev i{position:absolute;top:0;width:100px;height:170px;background:linear-gradient(180deg,#ffe39a,#d4a53d);clip-path:polygon(0 0,45% 0,100% 50%,45% 100%,0 100%,55% 50%)}
#top .lbl{position:absolute;right:200px;top:6px;font-family:NQ;font-size:86px;line-height:1.6;color:#fff;direction:rtl;white-space:nowrap;-webkit-text-stroke:2.2px #fff;text-shadow:0 4px 0 #050b33}
#top .lbl b{color:#ffe39a;font-weight:normal;-webkit-text-stroke:2.2px #ffe39a}
#top .ul{position:absolute;right:200px;top:150px;height:6px;width:0;background:#e2b84f;border-radius:3px}
#brand{position:absolute;right:30px;top:20px;width:136px;height:136px;border-radius:50%;background:url('__LOGO__') center/cover;box-shadow:0 0 0 5px #e2b84f,0 0 28px rgba(124,196,255,.7);z-index:5}
#brand2{position:absolute;right:40px;bottom:30px;width:110px;height:110px;border-radius:50%;background:url('__LOGO__') center/cover;box-shadow:0 0 0 4px #e2b84f;z-index:5}
/* yellow box */
.box{position:absolute;right:0;top:640px;width:690px;min-height:560px}
.blk{position:absolute;background:linear-gradient(135deg,#ffe39a,#e2b84f 55%,#d4a53d);opacity:.96}
.tx{position:absolute;right:42px;top:44px;width:600px;direction:rtl;text-align:right;font-family:NQ;font-size:70px;line-height:1.75;color:#0a1550;opacity:0;-webkit-text-stroke:.8px #0a1550}
.gl{position:absolute;background:rgba(226,184,79,.8)}
.ctry{position:absolute;right:0;top:556px;height:78px;padding:0 36px;background:#0a1550;color:#ffe39a;border-left:8px solid #e2b84f;font-family:NQ;font-size:46px;line-height:1.55;direction:rtl;opacity:0;white-space:nowrap}
.co{position:absolute;left:40px;top:1280px;width:150px;height:150px;border-radius:26px;background:#fff center/72% no-repeat;box-shadow:0 14px 40px rgba(0,0,0,.5);opacity:0}
/* bottom band */
#bot{position:absolute;left:0;right:0;bottom:0;height:240px;background:linear-gradient(180deg,rgba(10,21,80,0),#0a1550 50%);}
#bot .glow{position:absolute;left:340px;bottom:70px;width:400px;height:60px;border-radius:50%;background:radial-gradient(#7cc4ff,rgba(124,196,255,0) 70%);opacity:.7}
#bot .t{position:absolute;right:170px;bottom:52px;font-family:NQ;font-size:50px;color:#ffe39a;direction:rtl}
#prog{position:absolute;left:0;bottom:0;height:10px;background:linear-gradient(90deg,#d4a53d,#ffe39a);width:0}
.bolt{display:inline-block;width:.55em;height:.85em;background:#ffe39a;clip-path:polygon(55% 0,10% 58%,45% 58%,30% 100%,90% 38%,55% 38%,75% 0);vertical-align:-.05em;margin-left:.2em}
.spark{position:absolute;width:7px;height:7px;border-radius:50%;background:#ffe39a;box-shadow:0 0 10px #e2b84f}
/* end card */
#end{position:absolute;inset:0;background:radial-gradient(1200px 1400px at 50% 40%,#15286a,#0a1550 55%,#050b33);opacity:0}
#end .lg{position:absolute;left:390px;top:420px;width:300px;height:300px;border-radius:50%;background:url('__LOGO__') center/cover;box-shadow:0 0 0 8px #e2b84f,0 0 60px rgba(124,196,255,.6)}
#end .a{position:absolute;left:0;right:0;top:800px;text-align:center;font-family:NQ;font-size:64px;color:#cfe0ff}
#end .b{position:absolute;left:0;right:0;top:890px;text-align:center;font-family:NQ;font-size:120px;color:#ffe39a}
#end .sub{position:absolute;left:290px;top:1140px;width:500px;height:120px;border-radius:24px;background:linear-gradient(180deg,#ffe39a,#d4a53d);color:#0a1550;font-family:NQ;font-size:60px;line-height:1.7;text-align:center}
#end .m{position:absolute;left:0;right:0;top:1320px;text-align:center;font-family:NQ;font-size:50px;color:#cfe0ff}
/* opening */
#open{position:absolute;inset:0;opacity:0}
#open .k{position:absolute;right:0;left:0;top:780px;text-align:center;font-family:NQ;font-size:150px;color:#ffe39a;text-shadow:0 6px 30px rgba(0,0,0,.6)}
#open .s{position:absolute;right:0;left:0;top:1000px;text-align:center;font-family:NQ;font-size:64px;color:#fff}
</style></head><body>
<div id="items"></div>
<div id="open"><div class="ph" id="openph"></div><div class="dim" style="background:rgba(0,0,0,.55)"></div><div class="lg" style="position:absolute;left:400px;top:470px;width:280px;height:280px;border-radius:50%;background:url('__LOGO__') center/cover;box-shadow:0 0 0 8px #e2b84f,0 0 60px rgba(124,196,255,.6)"></div><div class="k"><span class="bolt"></span> اے آئی فلیش</div><div class="s" id="opens"></div></div>
<div id="top"><div class="plate"></div><div class="chev"><i style="right:0"></i><i style="right:70px"></i><i style="right:140px"></i></div>
 <div class="lbl" id="lbl"></div><div class="ul" id="ul"></div></div>
<div id="brand"></div><div id="brand2"></div>
<div id="bot"><div class="glow"></div><div class="t">فاروقی اے آئی نیوز</div></div>
<div id="sparks"></div>
<div id="prog"></div>
<div id="end"><div class="lg"></div><div class="a">دیکھنے کا</div><div class="b">شکریہ</div><div class="sub">سبسکرائب کریں</div><div class="m">مزید خبروں کے لیے ہمارے ساتھ جڑے رہیے</div></div>
<script>
const NF=__NFDATA__;
const $=id=>document.getElementById(id);
const esc=s=>(s||'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const U=n=>String(n).padStart(2,'0').replace(/\d/g,d=>'۰۱۲۳۴۵۶۷۸۹'[d]);
$('items').innerHTML=NF.items.map((it,i)=>`<div class="it" id="it${i}"><div class="ph" style="background-image:url('${it.photo||''}')"></div><div class="dim"></div>
 ${it.country?`<div class="ctry">${esc(it.country)}</div>`:''}
 <div class="box"><div class="gl" style="right:640px;top:120px;width:420px;height:3px;opacity:0"></div><div class="gl" style="right:200px;top:-120px;width:3px;height:780px;opacity:0"></div>
 <div class="blk b0"></div><div class="blk b1"></div><div class="blk b2"></div><div class="tx">${esc(it.h)}</div></div>
 ${it.logo?`<div class="co" style="background-image:url('${it.logo}')"></div>`:''}</div>`).join('');
if(NF.open_photo) $('openph').style.backgroundImage=`url('${NF.open_photo}')`;
$('opens').textContent=NF.open_sub||'';
const sp=[];for(let i=0;i<26;i++){const d=document.createElement('div');d.className='spark';$('sparks').appendChild(d);sp.push({e:d,x:Math.random()*1080,y:Math.random()*1920,v:40+Math.random()*90,ph:Math.random()*6})}
// box height follows text
const ease=x=>1-Math.pow(1-Math.max(0,Math.min(1,x)),3);
function render(t){
 const T=NF.dur;
 $('open').style.opacity=t<NF.open_end?1:Math.max(0,1-(t-NF.open_end)/0.3);
 let cur=-1;
 NF.items.forEach((it,i)=>{
  const e=$('it'+i),on=t>=it.t0&&t<it.t1;
  e.style.opacity=on?Math.min(1,(t-it.t0)/0.18):0;
  if(!on)return; cur=i;
  const p=(t-it.t0)/(it.t1-it.t0);
  e.querySelector('.ph').style.transform=`scale(${1.06+0.08*p}) translate(${(i%2?-1:1)*30*p}px,${-20*p}px)`;
  const k=t-it.t0, tx=e.querySelector('.tx'), h=Math.max(380,tx.scrollHeight+88);
  const bs=e.querySelectorAll('.blk');
  bs[0].style.cssText=`right:0;top:0;width:${640*ease(k/0.25)}px;height:${h*0.34}px`;
  bs[1].style.cssText=`right:0;top:${h*0.33}px;width:${640*ease((k-0.08)/0.25)}px;height:${h*0.35}px`;
  bs[2].style.cssText=`right:0;top:${h*0.67}px;width:${640*ease((k-0.16)/0.25)}px;height:${h*0.33}px`;
  tx.style.opacity=ease((k-0.3)/0.25); tx.style.transform=`translateX(${(1-ease((k-0.3)/0.25))*40}px)`;
  e.querySelectorAll('.gl').forEach(g=>g.style.opacity=ease((k-0.2)/0.3)*0.8);
  const c=e.querySelector('.ctry'); if(c){c.style.opacity=ease((k-0.35)/0.25);c.style.transform=`translateX(${(1-ease((k-0.35)/0.25))*120}px)`}
  const co=e.querySelector('.co'); if(co){co.style.opacity=ease((k-0.5)/0.3);co.style.transform=`scale(${0.8+0.2*ease((k-0.5)/0.3)})`}
 });
 const showTop=cur>=0;
 $('top').style.opacity=showTop?1:0; $('brand').style.opacity=showTop?1:0; $('brand2').style.opacity=t<NF.end_t?1:0;
 if(showTop){$('lbl').innerHTML=`<span class="bolt"></span> تازہ خبر <b>${U(cur+1)}</b>`;const k=t-NF.items[cur].t0;$('ul').style.width=(330*ease(k/0.4))+'px'}
 $('end').style.opacity=t>=NF.end_t?Math.min(1,(t-NF.end_t)/0.3):0;
 $('prog').style.width=(1080*Math.min(1,t/T))+'px';
 sp.forEach(s=>{const y=(s.y-s.v*t)%1920;s.e.style.transform=`translate(${s.x+20*Math.sin(t*1.3+s.ph)}px,${y<0?y+1920:y}px)`;s.e.style.opacity=(0.4+0.5*Math.abs(Math.sin(t*2+s.ph)))*(t<NF.end_t?1:0)});
}
document.fonts.ready.then(()=>{render(0);document.title='ready'});
</script></body></html>
