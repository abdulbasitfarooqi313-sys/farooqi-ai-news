<script>
const $=id=>document.getElementById(id);
const IB='__IMGB__';
if(IB.startsWith('data:')){ $('imgB').style.backgroundImage=`url('${IB}')`;$('phB').style.display='none';}
const NF=__NFDATA__;   // {split:[[t,k]..], stories:[{t0,t1,h,topic,loc}], wipes:[t..]}
const tk=$('tk');let tw=0,cur=-1;
const SPLIT=NF.split;
const UR=s=>String(s).replace(/[0-9]/g,d=>'۰۱۲۳۴۵۶۷۸۹'[d]);
function ez(x){x=Math.max(0,Math.min(1,x));return x*x*(3-2*x);}
function seg(t,K){for(let i=1;i<K.length;i++){if(t<=K[i][0]){const [a,va]=K[i-1],[b,vb]=K[i];return va+(vb-va)*ez((t-a)/(b-a||1));}}return K[K.length-1][1];}
window.render=function(t){
 const k=seg(t,SPLIT);                      // 0 = پوری اسکرین، 1 = دو خانے
 const A=$('paneA');A.style.width=(1828-828*k).toFixed(1)+'px';
 const w=1828-828*k,zm=(1+.03*Math.min(1,t/16))*(1+.14*seg(t,NF.zoom||[[0,0]])*(1-k)),sc=Math.max(w/1715,690/1184)*zm,SW=1715*sc,SH=1184*sc;
 const zo=seg(t,NF.zoom||[[0,0]]),px=(30+14*zo*(1-k)-30*k)/100,py=(58-8*k)/100;$('stage').style.transform=`translate(${((w-SW)*px).toFixed(1)}px,${((690-SH)*py).toFixed(1)}px) scale(${sc.toFixed(4)})`;
 const fi=Math.min(NF.energy.length-1,Math.max(0,Math.round(t*25))),e=NF.energy.length?NF.energy[fi]:0;
 const th=.35*Math.sin(t*.9)+1.1*e*Math.sin(t*5.3)+.4*e*Math.sin(t*2.7+1),ty=1.8*e*Math.sin(t*8.1),br=1+.005*Math.sin(t*Math.PI*2/4.2);
 $('afg').style.transformOrigin='267px 347px';$('afg').style.transform=`translateY(${ty.toFixed(2)}px) rotate(${th.toFixed(3)}deg) scaleY(${br.toFixed(4)})`;
 let bo=0;const bp=[3.7,4.6,3.1,5.2,4.1];let bt=1.2,bi=0;while(bt<t+1){const d=t-bt;if(d>=0&&d<.18)bo=1-Math.abs(d-.09)/.09;bt+=bp[bi++%5];}
 $('ablink').style.opacity=Math.max(0,Math.min(1,bo*1.6)).toFixed(2);
 const B=$('paneB');B.style.opacity=k.toFixed(3);B.style.transform=`translateX(${(-80*(1-k)).toFixed(1)}px)`;
 const kp=ez((k-0.5)/0.5);$('pip').style.opacity=kp.toFixed(3);$('pip').style.transform=`translateX(${(-40*(1-kp)).toFixed(1)}px)`;
 let si=-1;NF.stories.forEach((s,i)=>{if(t>=s.t0)si=i;});
 if(si!==cur){cur=si;if(si>=0){const s=NF.stories[si];$('scene').innerHTML=nfScene(s.topic);$('loc').textContent=s.loc||'';$('ln').textContent=s.co||'خبر';$('shd').textContent=s.h;$('ssc').innerHTML=nfScene(s.topic);$('slg').innerHTML=s.logo?`<img src="${s.logo}">`:`<span class="ini">${(s.co||'AI').slice(0,2)}</span>`;$('lt').textContent=s.h;$('hh').textContent=s.h;}}
 if(si>=0){const s=NF.stories[si];nfAnimate($('scene'),t-s.t0);const lo=ez((t-s.t0-0.3)/0.6)*(1-ez((t-(s.t1-0.5))/0.5))*(1-seg(t,NF.side||[[0,0]]));$('lower').style.opacity=lo.toFixed(3);
  $('lower').style.transform=`translateY(${(30*(1-lo)).toFixed(1)}px)`;}else{$('lower').style.opacity=0;}
 let wo=0,wx=-2400,wl='';NF.wipes.forEach((w,i)=>{const d=t-w[0];if(d>=0&&d<1.4){wx=-2400+(1920+2400)*(d/1.4);wo=Math.sin(Math.PI*Math.min(1,d/1.4));wl=w[1];}});
 const pv=seg(t,NF.pk||[[0,0]]);let pc=null;(NF.pkgs||[]).forEach(q=>{if(t>=q.t0&&t<q.t1)pc=q;});
 if(pc&&pc.i!==window._pci){window._pci=pc.i;const c=NF.cards[pc.i];$('pti').textContent=c.h;$('psc').innerHTML=nfScene(c.topic);
  $('purl').textContent=c.url?('https://'+c.url):'';$('psv').textContent=c.src||c.co||'';
  $('pvp').innerHTML=c.shot?`<img src="${c.shot}">`:(c.logo?`<div class="big"><img src="${c.logo}"></div>`:`<div class="big"></div>`);
  if(!c.shot&&!c.logo)$('pvp').querySelector('.big').innerHTML=nfScene(c.topic);
  $('ppl').innerHTML=(c.pts||[]).map((x,j)=>`<div class="pt"><b>${j+1}</b><span>${x}</span></div>`).join('');}
 if(pc){const lt=t-pc.t0,L=pc.t1-pc.t0;nfAnimate($('psc'),lt);const im=$('pvp').querySelector('img');
  if(im&&!im.parentElement.classList.contains('big'))im.style.transform=`scale(${(1.02+0.12*lt/L).toFixed(4)}) translateY(${(-40*lt/L).toFixed(1)}px)`;
  $('ppl').querySelectorAll('.pt').forEach((e,j)=>{const at=0.12+j*0.25;const v=Math.min(1,Math.max(0,(lt/L-at)/0.06));e.style.opacity=v;e.style.transform=`translateX(${(40*(1-v)).toFixed(1)}px)`});}
 $('pkg').style.opacity=pv.toFixed(3);$('pkg').style.transform=`scale(${(1.05-0.05*pv).toFixed(4)})`;
 const hv=seg(t,NF.hl||[[0,0]]);let hc=null;(NF.hcards||[]).forEach(c=>{if(t>=c.t0-0.6&&t<c.t1+0.6)hc=c;});
