<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:NQ;src:url('__NQFONT__')}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1920px;height:1080px;overflow:hidden;background:#ff00ff}
.sc{position:absolute;inset:0;opacity:0}
.key{background:#ff00ff}
.dark{background:radial-gradient(1400px 900px at 70% 30%,#13265f 0%,#0a1544 55%,#050b2a 100%)}
.grid{position:absolute;inset:0;opacity:.07;background-image:linear-gradient(#9fc3ff 1px,transparent 1px),linear-gradient(90deg,#9fc3ff 1px,transparent 1px);background-size:80px 80px}
.shade{position:absolute;inset:0;background:linear-gradient(0deg,rgba(3,8,30,.82) 0%,rgba(3,8,30,.15) 45%,rgba(3,8,30,0) 70%)}
.rtl{direction:rtl;text-align:right;font-family:NQ,serif}
/* title */
#title .box{position:absolute;right:130px;top:300px;width:1400px}
#title .box{background:#070f33;padding:34px 46px 40px;border-radius:14px;border-right:8px solid #e2b84f;width:auto;max-width:1400px}
#title .k{display:inline-block;font-size:44px;color:#0a1550;background:#e2b84f;padding:0 26px 10px;border-radius:6px}
#title .h{font-size:96px;line-height:1.5;color:#fff;margin-top:24px;text-shadow:0 6px 24px rgba(0,0,0,.5)}
#title .d{font-size:46px;color:#cfdcff;margin-top:6px}
/* headline card */
.hl .num{position:absolute;right:130px;top:250px;font-family:NQ,serif;font-size:52px;color:#e2b84f}
.hl .t{position:absolute;right:130px;top:340px;width:1250px;font-size:104px;line-height:1.55;color:#fff}
.hl .bar{position:absolute;right:130px;top:330px;height:6px;background:#e2b84f;border-radius:3px}
.hl .logo{position:absolute;left:150px;top:330px;width:330px;height:330px;border-radius:36px;background:#fff center/70% no-repeat;
 box-shadow:0 20px 60px rgba(0,0,0,.45)}
.hl .lt{position:absolute;left:150px;top:690px;width:330px;text-align:center;font:600 40px Arial;color:#e8eeff}
/* website */
.site .shot{position:absolute;left:0;top:0;width:1920px;transform-origin:50% 0}
.site .src{position:absolute;left:70px;top:70px;font:600 30px Arial;color:#fff;background:rgba(5,11,42,.82);padding:10px 22px;border-radius:8px;border-left:6px solid #e2b84f}
/* key points */
.pts .bgimg{position:absolute;inset:-40px;background-size:cover;background-position:50% 0;filter:blur(18px) brightness(.35)}
.pts .lbl{position:absolute;right:130px;top:170px;font-size:48px;color:#e2b84f}
.pts .p{position:absolute;right:130px;width:1500px;font-size:74px;line-height:1.6;color:#fff;opacity:0}
.pts .p b{display:inline-block;width:70px;height:70px;line-height:76px;text-align:center;border-radius:50%;background:#e2b84f;color:#0a1550;
 font:700 40px Arial;margin-left:28px;vertical-align:12px}
/* location */
.loc .pin{position:absolute;right:130px;top:380px;font-size:120px;line-height:1.4;color:#fff}
.loc .pin i{font-style:normal;color:#e2b84f}
.loc .who{position:absolute;right:134px;top:600px;font-size:52px;color:#cfdcff}
.chip{position:absolute;right:70px;top:70px;font-size:40px;line-height:1.9;color:#0a1550;background:#e2b84f;padding:0 26px;border-radius:6px}
/* bridge */
#bridge .t{position:absolute;right:130px;top:420px;font-size:130px;color:#fff}
#bridge .bar{position:absolute;right:130px;top:410px;height:6px;width:420px;background:#e2b84f}
/* always-on */
#bug{position:absolute;right:52px;bottom:200px;width:120px;height:120px;border-radius:50%;background:url('__LOGO__') center/cover;opacity:.92;
 box-shadow:0 0 0 3px rgba(226,184,79,.85)}
#cap{position:absolute;left:220px;right:220px;bottom:70px;text-align:center;direction:rtl}
#cap span{display:inline;font-family:NQ,serif;font-size:58px;line-height:1.95;color:#fff;background:#070f33;
 padding:2px 26px 12px;-webkit-box-decoration-break:clone;box-decoration-break:clone;border-radius:6px}
</style></head><body>
<div id="scenes"></div>
<div id="bug"></div>
<div id="cap"><span id="capt"></span></div>
<script>
const NF=__NFDATA__;
const $=id=>document.getElementById(id);
const esc=s=>(s||'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const U=n=>String(n).replace(/\d/g,d=>'۰۱۲۳۴۵۶۷۸۹'[d]);
function html(s,i){
 if(s.kind==='title') return `<div class="sc key" id="title"><div class="box rtl"><div class="k">${esc(s.kicker)}</div><div class="h">${esc(s.h)}</div><div class="d">${esc(s.date)}</div></div></div>`;
 if(s.kind==='headline') return `<div class="sc dark hl"><div class="grid"></div><div class="num rtl">${esc(s.num)}</div><div class="bar"></div><div class="t rtl">${esc(s.h)}</div>`+
   (s.logo?`<div class="logo" style="background-image:url('${s.logo}')"></div>`:'')+`<div class="lt">${esc(s.co)}</div></div>`;
 if(s.kind==='bridge') return `<div class="sc dark" id="bridge"><div class="grid"></div><div class="bar"></div><div class="t rtl">${esc(s.h)}</div></div>`;
 if(s.kind==='site') return `<div class="sc dark site"><img class="shot" src="${s.shot}"><div class="src">${esc(s.url)}</div></div>`;
 if(s.kind==='points') return `<div class="sc dark pts"><div class="grid"></div><div class="lbl rtl">اہم نکات</div>`+
   s.pts.map((p,j)=>`<div class="p rtl" style="top:${300+j*190}px"><b>${j+1}</b>${esc(p)}</div>`).join('')+`</div>`;
 if(s.kind==='loc') return `<div class="sc dark loc"><div class="grid"></div><div class="pin rtl"><i>⌖</i> ${esc(s.loc)}</div><div class="who rtl">${esc(s.who)}</div></div>`;
 if(s.kind==='broll') return `<div class="sc key">${s.chip?`<div class="chip rtl">${esc(s.chip)}</div>`:''}</div>`;
 return `<div class="sc key"></div>`;
}
$('scenes').innerHTML=NF.scenes.map(html).join('');
const els=[...document.querySelectorAll('.sc')];
function render(t){
 NF.scenes.forEach((s,i)=>{
  const e=els[i],on=t>=s.t0&&t<s.t1, a=Math.min(1,(t-s.t0)/0.35);
  e.style.opacity=on?Math.max(0,a).toFixed(3):0;
  if(!on) return;
  const p=(t-s.t0)/Math.max(.1,s.t1-s.t0);
  if(s.kind==='site'){const im=e.querySelector('.shot');const sc=1.0+0.08*p;im.style.transform=`translateY(${-Math.min(1,p)*s.pan}px) scale(${sc})`;}
  if(s.kind==='points'){e.querySelectorAll('.p').forEach((n,j)=>{const at=s.t0+0.6+j*(s.t1-s.t0-0.6)/s.pts.length;
     const k=Math.max(0,Math.min(1,(t-at)/0.4));n.style.opacity=k;n.style.transform=`translateX(${(1-k)*-40}px)`;});}
  if(s.kind==='headline'){e.querySelector('.bar').style.width=(Math.min(1,(t-s.t0)/0.6)*520)+'px';}
  if(s.kind==='title'){e.querySelector('.box').style.transform=`translateY(${(1-Math.min(1,(t-s.t0)/0.6))*30}px)`;}
 });
 const c=NF.caps.find(c=>t>=c.t0&&t<c.t1);
 $('capt').textContent=c?c.text:''; $('cap').style.opacity=c?1:0;
}
document.fonts.ready.then(()=>{render(0);document.title='ready'});
</script></body></html>
